<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido · EcoCode</title>
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/inicio.css">
    <link rel="stylesheet" href="../css/solicitacoes.css">
</head>
<body>

    <div id="app">

        <aside class="lateral">

            <header class="marca">

                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
                <span>EcoCode</span>

            </header>

            <nav class="menu">

                <a href="inicio.html">Início</a>
                <a href="cadastrar-residuo.html">Cadastrar resíduo</a>
                <a href="meus-residuos.html">Meus resíduos</a>
                <a href="pmp.html">Ponto mais próximo</a>
                <a href="solicitar-descarte.html">Solicitar descarte</a>
                <a href="solicitacoes.html" class="ativo">Minhas solicitações</a>
                <a href="perfil.html">Meu perfil</a>

            </nav>

            <div class="lateral-rodape">

                <div class="tema" role="group" aria-label="Tema">

                    <button type="button" data-tema="claro" class="ativo">Claro</button>
                    <button type="button" data-tema="escuro">Escuro</button>

                </div>

                <p class="usuario-nome" id="usuario-nome"></p>
                <p class="usuario-info" id="usuario-info"></p>
                <a href="login.html" id="sair" class="sair">Sair</a>

            </div>

        </aside>

        <main class="conteudo">

            <header class="topo-pagina">

                <div class="titulo-pagina">

                    <a href="solicitacoes.html" class="voltar">Voltar para minhas solicitações</a>

                    <div class="titulo-linha">

                        <h1 id="titulo">Pedido</h1>
                        <span class="etiqueta" id="etiqueta-pedido"></span>

                    </div>

                </div>

                <button type="button" class="btn-cancelar-pedido" hidden id="botao-cancelar">Cancelar solicitação</button>

            </header>

            <div class="alerta-sucesso" id="aviso-sucesso" role="status">Solicitação enviada. Ela entrou na fila de coletas.</div>

            <div class="grade-duas">

                <section class="cartao linha-tempo-cartao">

                    <h2>Linha do tempo</h2>

                    <ol class="linha-tempo" id="etapas"></ol>

                    <div class="itens-pedido">

                        <h3>Resíduos do pedido</h3>

                        <ul id="materiais"></ul>

                    </div>

                </section>

                <div class="coluna-lateral"><section class="cartao detalhes-pedido" id="detalhes"></section></div></div></main>

    </div>


    <script src="/javascript/inicio.js"></script>
    <script type="module" src="/javascript/web.js"></script>
</body>
</html>
