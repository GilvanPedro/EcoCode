<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log de auditoria · EcoCode</title>
    <link rel="icon" type="image/png" href="/assets/icons/favicon.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/inicio.css">
    <link rel="stylesheet" href="/css/equipe.css">
</head>
<body>

    <div id="app">

        <aside class="lateral">

            <header class="marca">

                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
                <span>EcoCode</span>

            </header>

            <nav class="menu">

                <p class="menu-titulo">Equipe</p>

                <a href="fila-coletas.html">Fila de coletas</a>
                <a href="pontos-coleta.html">Pontos de coleta</a>
                <a href="log-auditoria.html" class="ativo">Log de auditoria</a>

                <div class="menu-gerente" id="menu-gerente">

                    <p class="menu-titulo">Gerente</p>

                    <a href="todas-solicitacoes.html">Todas as solicitações</a>
                    <a href="alterar-cargo.html">Alterar cargo</a>

                </div>

            </nav>

            <div class="lateral-rodape">

                <div class="tema" role="group" aria-label="Tema">

                    <button type="button" data-tema="claro" class="ativo">Claro</button>
                    <button type="button" data-tema="escuro">Escuro</button>

                </div>

                <p class="usuario-nome" id="usuario-nome"></p>
                <p class="usuario-info" id="usuario-info"></p>
                <a href="login.html" id="sair" class="sair">Sair</a>

            </div>

        </aside>

        <main class="conteudo">

            <header class="topo-pagina">

                <div class="titulo-pagina">

                    <h1>Log de auditoria</h1>
                    <p class="sub">Mais recente primeiro. Os registros não podem ser editados nem apagados.</p>

                </div>

                <div class="controles">

                    <select class="seletor" id="filtro-acao" aria-label="Filtrar por ação"><option value="">Todas as ações</option></select>

                    <input type="search" class="busca" id="busca" placeholder="Buscar nos registros">

                </div>

            </header>

            <section class="cartao tabela-cartao">

                <div class="tabela-rolagem">

                    <table>

                        <thead>

                            <tr>

                                <th>Quando</th>
                                <th>Quem</th>
                                <th>Ação</th>
                                <th>Alvo</th>


                            </tr>

                        </thead>

                        <tbody id="corpo-log"></tbody>

                    </table>

                </div>

                <p class="sem-resultados" id="sem-resultados" hidden>Nenhum registro encontrado.</p>

            </section>

            <p class="nota" id="contagem"></p>

        </main>

    </div>


    <script src="/javascript/inicio.js"></script>
    <script type="module" src="/javascript/web.js"></script>
</body>
</html>
