# 1) frontend_ecocode/html/ -> as páginas abrem direto em localhost:8080/login.html
# 2) frontend_ecocode/     -> é onde ficam css/, javascript/ e assets/
spring.web.resources.static-locations=classpath:/frontend_ecocode/html/,classpath:/frontend_ecocode/
